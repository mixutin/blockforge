<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>Choose a new password · Kindlr</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
</head>
<body>
<main class="wrap"><div class="card narrow" id="box"><h1>Choose a new password</h1><form id="form"><label for="p1">New password</label><input id="p1" type="password" autocomplete="new-password" minlength="8" maxlength="200" required /><label for="p2">Repeat new password</label><input id="p2" type="password" autocomplete="new-password" minlength="8" maxlength="200" required /><button id="go" class="primary" type="submit">Set new password</button></form><div id="msg" class="err"></div></div></main>
<script type="module" src="./src/pages/reset.js"></script>
</body>
</html>
