# Example nginx config for Blockforge. Replace example.com / YOUR_DOMAIN.
# Rate-limit zones are expected to exist already (http {} context), e.g.:
#   limit_req_zone $binary_remote_addr zone=blocks_auth:10m rate=5r/m;
#   limit_req_zone $binary_remote_addr zone=blocks_api:10m rate=10r/s;

# ---- Editor + API: https://editor.example.com
server {
    listen 443 ssl http2;
    server_name editor.example.com;
    # ssl_certificate / ssl_certificate_key ...

    root /var/www/blocks;
    index index.html;
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'; frame-src https://run.example.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /api/login  { limit_req zone=blocks_auth burst=5 nodelay; proxy_pass http://127.0.0.1:8795; include /etc/nginx/proxy_params; }
    location = /api/signup { limit_req zone=blocks_auth burst=5 nodelay; proxy_pass http://127.0.0.1:8795; include /etc/nginx/proxy_params; }
    location /api/         { limit_req zone=blocks_api burst=40 nodelay; proxy_pass http://127.0.0.1:8795; include /etc/nginx/proxy_params; }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}

# ---- Sandboxed runtime (player): https://run.example.com  -> serves /var/www/blocks/player
server {
    listen 443 ssl http2;
    server_name run.example.com;
    root /var/www/blocks/player;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors https://editor.example.com" always;
    location / { try_files $uri =404; }
}
