# Example nginx config for Kindlr. Replace editor.example.com / run.example.com / old.example.com.
# Build with: VITE_RUNTIME_URL=https://run.example.com/ VITE_EMBED_RUNTIME_URL=https://run.example.com/embed-player/ \
#   PLAYER_EDITOR_ORIGINS=https://editor.example.com npm run build
# Header snippets live in /etc/nginx/snippets/ (kindlr-common-headers.conf, kindlr-noframe-headers.conf, kindlr-proxy.conf).
# Rule: there are NO server-level add_header directives; every location includes the snippets it needs.
#
# Which location gets which headers:
#   editor.example.com  /api/* (all)        common + noframe (X-Frame-Options DENY, frame-ancestors 'none'); app sends Cache-Control
#   editor.example.com  /embed/<share-id>   common + embed CSP (frame-ancestors *), NO X-Frame-Options        <- only framable page
#   editor.example.com  /assets/*           common + noframe + Cache-Control "public, max-age=31536000, immutable"
#   editor.example.com  everything else     common + noframe + Cache-Control "no-cache" (HTML revalidates)
#   run.example.com     /                   common + runtime CSP (connect-src 'none', frame-ancestors https://editor.example.com)
#   run.example.com     /embed-player/      common + runtime CSP with frame-ancestors * (same files, for /embed only)
#   old.example.com     *                   common + 301 to https://editor.example.com$request_uri
# The rate-limit zones blocks_auth / blocks_api are already defined in the http{} context (not here).

# ---- old address: permanent redirect (keeps path + query, e.g. old verify/share links)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name old.example.com;
    # ssl_certificate / ssl_certificate_key for old.example.com
    include /etc/nginx/snippets/kindlr-common-headers.conf;
    return 301 https://editor.example.com$request_uri;
}

# ---- editor + API + public pages: https://editor.example.com  (static files: /var/www/blocks)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name editor.example.com;
    # ssl_certificate / ssl_certificate_key for editor.example.com

    root /var/www/blocks;
    index index.html;
    client_max_body_size 6m;
    error_page 404 /404.html;
    gzip on; gzip_vary on; gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;

    # ---- auth-like endpoints: strict zone (exact matches, POST)
    location = /api/login {
        limit_req zone=blocks_auth burst=5 nodelay;
        include /etc/nginx/snippets/kindlr-proxy.conf;
        include /etc/nginx/snippets/kindlr-common-headers.conf;
        include /etc/nginx/snippets/kindlr-noframe-headers.conf;
    }
    location = /api/signup {
        limit_req zone=blocks_auth burst=5 nodelay;
        include /etc/nginx/snippets/kindlr-proxy.conf;
        include /etc/nginx/snippets/kindlr-common-headers.conf;
        include /etc/nginx/snippets/kindlr-noframe-headers.conf;
    }
    location = /api/password/forgot {
        limit_req zone=blocks_auth burst=5 nodelay;
        include /etc/nginx/snippets/kindlr-proxy.conf;
        include /etc/nginx/snippets/kindlr-common-headers.conf;
        include /etc/nginx/snippets/kindlr-noframe-headers.conf;
    }
    location = /api/password/reset {
        limit_req zone=blocks_auth burst=5 nodelay;
        include /etc/nginx/snippets/kindlr-proxy.conf;
        include /etc/nginx/snippets/kindlr-common-headers.conf;
        include /etc/nginx/snippets/kindlr-noframe-headers.conf;
    }
    location = /api/verify {
        limit_req zone=blocks_auth burst=5 nodelay;
        include /etc/nginx/snippets/kindlr-proxy.conf;
        include /etc/nginx/snippets/kindlr-common-headers.conf;
        include /etc/nginx/snippets/kindlr-noframe-headers.conf;
    }
    location = /api/verify/resend {
        limit_req zone=blocks_auth burst=5 nodelay;
        include /etc/nginx/snippets/kindlr-proxy.conf;
        include /etc/nginx/snippets/kindlr-common-headers.conf;
        include /etc/nginx/snippets/kindlr-noframe-headers.conf;
    }
    location = /api/account/password {
        limit_req zone=blocks_auth burst=5 nodelay;
        include /etc/nginx/snippets/kindlr-proxy.conf;
        include /etc/nginx/snippets/kindlr-common-headers.conf;
        include /etc/nginx/snippets/kindlr-noframe-headers.conf;
    }
    location = /api/account/email {
        limit_req zone=blocks_auth burst=5 nodelay;
        include /etc/nginx/snippets/kindlr-proxy.conf;
        include /etc/nginx/snippets/kindlr-common-headers.conf;
        include /etc/nginx/snippets/kindlr-noframe-headers.conf;
    }
    location = /api/account/delete {
        limit_req zone=blocks_auth burst=5 nodelay;
        include /etc/nginx/snippets/kindlr-proxy.conf;
        include /etc/nginx/snippets/kindlr-common-headers.conf;
        include /etc/nginx/snippets/kindlr-noframe-headers.conf;
    }

    # ---- everything else under /api/ (projects, sharing, explore, embed data, tokens, me, logout, health)
    location /api/ {
        limit_req zone=blocks_api burst=40 nodelay;
        include /etc/nginx/snippets/kindlr-proxy.conf;
        include /etc/nginx/snippets/kindlr-common-headers.conf;
        include /etc/nginx/snippets/kindlr-noframe-headers.conf;
    }

    # ---- the ONLY framable page: /embed/<share-id> (plays a public project; no cookies, login, save or editor)
    location ^~ /embed/ {
        try_files /embed.html =404;
        include /etc/nginx/snippets/kindlr-common-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src https://run.example.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors *" always;
        add_header Cache-Control "no-cache" always;
    }

    # ---- hashed, immutable build assets
    location /assets/ {
        include /etc/nginx/snippets/kindlr-common-headers.conf;
        include /etc/nginx/snippets/kindlr-noframe-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # the player is only served from run.example.com
    location /player/ { return 404; }

    # ---- pages: clean URLs (/verify /reset /explore /p /docs /embed /404) → *.html; HTML always revalidates
    location / {
        include /etc/nginx/snippets/kindlr-common-headers.conf;
        include /etc/nginx/snippets/kindlr-noframe-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }
}

# ---- sandboxed runtime: https://run.example.com  (static files: /var/www/blocks/player). Never sends X-Frame-Options (it must be framed).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name run.example.com;
    # ssl_certificate / ssl_certificate_key for run.example.com

    root /var/www/blocks/player;
    index index.html;
    gzip on; gzip_vary on; gzip_types text/css application/javascript image/svg+xml;

    # normal player: only the Kindlr site may frame it
    location / {
        include /etc/nginx/snippets/kindlr-common-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors https://editor.example.com" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
    # embed player: same files, same strict CSP, but any ancestor (CSP frame-ancestors checks EVERY ancestor, so the
    # player nested inside https://editor.example.com/embed/<id> on a third-party site needs this). The player still only talks
    # to a parent whose origin is https://editor.example.com; the iframe sandbox is allow-scripts only.
    location ^~ /embed-player/ {
        alias /var/www/blocks/player/;
        include /etc/nginx/snippets/kindlr-common-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors *" always;
        add_header Cache-Control "no-cache" always;
        # (no try_files here: alias + try_files is unreliable in nginx; missing files 404 by themselves)
    }
    location /api/ { return 404; }
}
