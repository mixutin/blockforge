# /etc/nginx/snippets/kindlr-common-headers.conf: included in EVERY location that serves a response.
# (nginx drops all inherited add_header directives as soon as a location has its own add_header, so every
#  location that sets headers must include this file.)
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), fullscreen=(self)" always;
